<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuryClaw 대시보드</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: #2a2a3a; --text: #e0e0e8; --text-dim: #6a6a80;
    --accent: #8b5cf6; --accent2: #a78bfa;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308;
    --blue: #3b82f6; --cyan: #06b6d4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; color:var(--accent2); }
  .logo svg { width:24px; height:24px; }
  .status-badge { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; text-transform:uppercase; }
  .status-idle { background:var(--surface2); color:var(--text-dim); }
  .status-planning { background:#1e1b4b; color:var(--accent2); }
  .status-executing { background:#052e16; color:var(--green); }
  .status-waiting_user { background:#422006; color:var(--yellow); }
  .status-replanning { background:#172554; color:var(--blue); }
  .status-done { background:#052e16; color:var(--green); }
  .status-error { background:#450a0a; color:var(--red); }
  .stats { display:flex; gap:16px; font-size:12px; color:var(--text-dim); }
  .stats .v { color:var(--text); font-weight:600; }

  /* Config bar */
  .config-bar { display:flex; align-items:center; gap:10px; padding:6px 20px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; font-size:11px; }
  .config-bar label { color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
  .config-bar select { background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:11px; padding:2px 4px; outline:none; }
  .token-tag { margin-left:auto; font-family:'Cascadia Code',monospace; font-size:12px; color:var(--text-dim); display:flex; gap:8px; }
  .token-tag .v { color:var(--text); }
  .cost-tag { font-family:'Cascadia Code',monospace; font-size:14px; color:var(--green); font-weight:700; }

  /* Main layout: chat left, workers right */
  .main { display:grid; grid-template-columns:1fr 380px; flex:1; min-height:0; }

  /* Chat area */
  .chat-area { display:flex; flex-direction:column; min-height:0; }
  .chat-messages { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
  .chat-input-area { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .chat-input { flex:1; padding:10px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; }
  .chat-input:focus { border-color:var(--accent); }
  .chat-input::placeholder { color:var(--text-dim); }
  .btn { padding:10px 18px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-send { background:var(--accent); color:white; }
  .btn-send:hover { background:var(--accent2); }

  /* Chat messages */
  .msg { max-width:80%; padding:10px 14px; border-radius:10px; font-size:13px; line-height:1.6; word-break:break-word; }
  .msg.msg-worker { max-width:100%; }
  .msg-user { align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:2px; }
  .msg-pm { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:2px; }
  .msg-worker { align-self:stretch; background:var(--surface2); border:1px solid var(--border); border-bottom-left-radius:2px; font-family:'Cascadia Code',monospace; font-size:12px; width:100%; padding:12px 14px; }
  .msg-worker pre { white-space:pre-wrap; word-break:break-word; padding:0; margin:0; line-height:1.6; }
  .msg-label { font-size:10px; color:var(--text-dim); margin-bottom:3px; }
  .msg-pm .msg-label { color:var(--accent2); }
  .msg-worker .msg-label { color:var(--cyan); }
  .msg-question { border-color:var(--yellow); }
  .msg-time { font-size:10px; color:var(--text-dim); margin-top:2px; }
  .msg pre { white-space:pre-wrap; margin:4px 0; }
  .msg-status { font-size:12px; color:var(--text-dim); text-align:center; padding:4px; }
  .msg-status.success { color:var(--green); }
  .msg-status.error { color:var(--red); }

  /* Waiting indicator */
  .waiting-banner { padding:8px 20px; background:#422006; color:var(--yellow); font-size:12px; text-align:center; font-weight:600; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }

  /* Workers panel */
  .workers-panel { border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:12px; }
  .workers-panel h3 { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }

  /* Phase bar */
  .phase-bar { display:flex; gap:2px; margin-bottom:12px; }
  .phase-step { flex:1; padding:5px 0; text-align:center; font-size:10px; font-weight:600; border-radius:3px; background:var(--surface2); color:var(--text-dim); }
  .phase-step.active { animation:phaseGlow 1.5s infinite; }
  .phase-step.done { color:var(--green); background:#052e16; }
  .phase-step.phase-planning.active { background:#1e1b4b; color:var(--accent2); }
  .phase-step.phase-executing.active { background:#172554; color:var(--blue); }
  .phase-step.phase-waiting_user.active { background:#422006; color:var(--yellow); }
  @keyframes phaseGlow { 0%,100%{opacity:1;} 50%{opacity:.6;} }

  /* Worker cards */
  .worker-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; }
  .worker-card.running { border-color:var(--blue); }
  .worker-card.done { border-color:var(--green); }
  .worker-card.failed { border-color:var(--red); }
  .wc-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .wc-id { font-weight:700; font-size:13px; }
  .wc-role { font-size:10px; padding:1px 6px; border-radius:4px; background:var(--surface2); color:var(--text-dim); }
  .wc-status { font-size:10px; display:flex; align-items:center; gap:4px; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .dot-pending { background:var(--text-dim); }
  .dot-running { background:var(--blue); animation:pulse 1.2s infinite; }
  .dot-done { background:var(--green); }
  .dot-failed { background:var(--red); }
  .dot-waiting { background:var(--yellow); animation:pulse 1.2s infinite; }
  .wc-mission { font-size:11px; color:var(--text-dim); margin-bottom:6px; line-height:1.4; }
  .wc-meta { display:grid; grid-template-columns:1fr 1fr; gap:4px; font-size:11px; color:var(--text-dim); }
  .wc-meta .v { color:var(--text); }
  .wc-tool { font-size:11px; color:var(--cyan); margin-top:4px; }
  .wc-progress { font-size:11px; color:var(--accent2); margin:4px 0; font-weight:600; }
  .wc-progress-bar { height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; margin:3px 0 6px; }
  .wc-progress-bar > div { height:100%; background:var(--accent); transition:width .3s; }
  .wc-plan { margin:4px 0 6px; font-size:11px; }
  .wc-plan .ps { padding:2px 4px; display:flex; gap:4px; align-items:flex-start; }
  .wc-plan .ps-icon { flex-shrink:0; width:12px; }
  .wc-plan .ps-title { flex:1; word-break:break-word; }
  .wc-plan .ps-pending { color:var(--text-dim); }
  .wc-plan .ps-running { color:var(--blue); font-weight:600; }
  .wc-plan .ps-done { color:var(--green); }
  .wc-plan .ps-stolen { color:var(--yellow); text-decoration:line-through; opacity:.7; }
  .wc-broadcasts { margin-top:4px; font-size:11px; color:var(--yellow); }
  .wc-broadcasts .br { padding:2px 0; }
  .wc-logs { max-height:80px; overflow-y:auto; font-family:'Cascadia Code',monospace; font-size:10px; color:var(--text-dim); background:var(--surface2); border-radius:4px; padding:4px 6px; margin-top:6px; }
  .wc-logs .ll { padding:1px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Orchestrator card */
  .orch-card { background:var(--bg); border:1px solid var(--accent); border-radius:8px; padding:10px; margin-bottom:12px; cursor:pointer; transition:border-color .2s; }
  .orch-card:hover { border-color:var(--accent2); }
  .orch-card .wc-header { margin-bottom:4px; }
  .orch-card .orch-activity { font-size:11px; color:var(--accent2); margin-top:4px; min-height:16px; }
  .orch-card .orch-activity.active { animation:pulse 1.5s infinite; }
  .worker-card { cursor:pointer; transition:border-color .2s; }
  .worker-card:hover { border-color:var(--accent); }

  /* Log popup overlay */
  .log-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.7); z-index:100; display:flex; align-items:center; justify-content:center; }
  .log-popup { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:80vw; max-width:900px; height:70vh; display:flex; flex-direction:column; }
  .log-popup-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
  .log-popup-header h2 { font-size:15px; font-weight:700; }
  .log-popup-close { background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; padding:4px 8px; }
  .log-popup-close:hover { color:var(--text); }
  .log-popup-body { flex:1; overflow-y:auto; padding:12px 16px; font-family:'Cascadia Code','Fira Code',monospace; font-size:12px; line-height:1.6; }
  .log-popup-body .lp-line { padding:2px 0; display:flex; gap:10px; }
  .lp-time { color:var(--text-dim); flex-shrink:0; }
  .lp-type-tool { color:var(--cyan); }
  .lp-type-text { color:var(--text); }
  .lp-type-init { color:var(--green); }
  .lp-type-warn { color:var(--yellow); }
  .lp-type-error { color:var(--red); }
  .lp-type-done { color:var(--green); font-weight:600; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
    FuryClaw
  </div>
  <span id="statusBadge" class="status-badge status-idle">IDLE</span>
  <div class="stats">
    <span>워커: <span class="v" id="sWorkers">0</span></span>
    <span>경과: <span class="v" id="sElapsed">0s</span></span>
    <span>토큰: <span class="v" id="sIn">0</span>/<span class="v" id="sOut">0</span></span>
  </div>
</div>

<div class="config-bar">
  <label>모델</label>
  <select id="cfgModel" onchange="updateConfig()">
    <option value="opus">Opus 4.6</option>
    <option value="sonnet">Sonnet 4.6</option>
    <option value="haiku">Haiku 4.5</option>
  </select>
  <label>추론</label>
  <select id="cfgEffort" onchange="updateConfig()">
    <option value="max">Max</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
  </select>
  <label>동시 워커</label>
  <select id="cfgConc" onchange="updateConfig()">
    <option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="5">5</option><option value="8">8</option>
  </select>
  <div class="token-tag" id="tokenTag">
    <span>&#8593;<span class="v" id="tokIn">0</span></span>
    <span>&#8595;<span class="v" id="tokOut">0</span></span>
  </div>
  <div class="cost-tag" id="costTag">$0.0000</div>
</div>

<div id="waitingBanner" class="waiting-banner" style="display:none">
  PM이 당신의 답변을 기다리고 있어요…
</div>

<div class="main">
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="msg-status">작업을 입력하면 PM이 계획을 세우고 워커들을 관리합니다.</div>
    </div>
    <div class="chat-input-area">
      <input id="chatInput" class="chat-input" type="text" placeholder="작업 지시나 PM 질문에 대한 답변을 입력…" />
      <button class="btn btn-send" onclick="sendMessage()">전송</button>
    </div>
  </div>

  <div class="workers-panel">
    <div class="phase-bar" id="phaseBar">
      <div class="phase-step phase-planning" data-phase="planning">계획</div>
      <div class="phase-step phase-executing" data-phase="executing">실행</div>
      <div class="phase-step phase-waiting_user" data-phase="waiting_user">사용자</div>
    </div>

    <div class="orch-card" id="orchCard" onclick="openLogPopup('orchestrator')">
      <div class="wc-header">
        <span class="wc-id">PM (오케스트레이터)</span>
        <div class="wc-status"><span class="dot" id="orchDot"></span><span id="orchStatusText">대기</span></div>
      </div>
      <div class="orch-activity" id="orchActivity">작업 대기 중…</div>
    </div>

    <h3>워커</h3>
    <div id="workersContainer"></div>
  </div>
</div>

<div class="log-overlay" id="logOverlay" style="display:none" onclick="if(event.target===this)closeLogPopup()">
  <div class="log-popup">
    <div class="log-popup-header">
      <h2 id="logPopupTitle">로그</h2>
      <button class="log-popup-close" onclick="closeLogPopup()">&times;</button>
    </div>
    <div class="log-popup-body" id="logPopupBody"></div>
  </div>
</div>

<script>
let ws, state = {}, lastChatLen = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'state') { state = m.data; render(); } };
  ws.onclose = () => setTimeout(connect, 2000);
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await fetch('/api/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
}

async function updateConfig() {
  await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: document.getElementById('cfgModel').value,
      effort: document.getElementById('cfgEffort').value,
      concurrency: document.getElementById('cfgConc').value,
    }),
  });
}

function render() {
  // Badge
  const b = document.getElementById('statusBadge');
  b.textContent = (state.status || 'idle').toUpperCase().replace('_', ' ');
  b.className = `status-badge status-${state.status || 'idle'}`;

  // Stats
  const workers = state.workers ? Object.values(state.workers) : [];
  document.getElementById('sWorkers').textContent = workers.length;
  document.getElementById('sElapsed').textContent = fmtMs(state.elapsed || 0);
  let ti=0, to=0;
  workers.forEach(w => { ti += w.inputTokens||0; to += w.outputTokens||0; });
  document.getElementById('sIn').textContent = ti.toLocaleString();
  document.getElementById('sOut').textContent = to.toLocaleString();
  document.getElementById('tokIn').textContent = ti.toLocaleString();
  document.getElementById('tokOut').textContent = to.toLocaleString();
  document.getElementById('costTag').textContent = `$${(state.totalCostUsd||0).toFixed(4)}`;

  // Config sync
  if (state.config) {
    const m=document.getElementById('cfgModel'), e=document.getElementById('cfgEffort'), c=document.getElementById('cfgConc');
    if (m && m !== document.activeElement) m.value = state.config.model;
    if (e && e !== document.activeElement) e.value = state.config.effort;
    if (c && c !== document.activeElement) c.value = String(state.config.concurrency);
  }

  // Waiting banner
  document.getElementById('waitingBanner').style.display = state.status === 'waiting_user' ? '' : 'none';

  // Phase bar
  renderPhaseBar();

  // Orchestrator card
  renderOrchCard();

  // Chat
  renderChat();

  // Workers
  renderWorkers(workers);

  // Update log popup if open
  if (activeLogPopup) renderLogPopup(activeLogPopup);
}

function renderChat() {
  const chat = state.chat || [];
  // 재렌더: 텍스트/개수가 바뀌면 다시 그림
  const container = document.getElementById('chatMessages');
  container.innerHTML = chat.map(m => {
    if (m.type === 'status' || m.type === 'plan' || m.type === 'result' || m.from === 'system') {
      const cls = m.text.includes('실패') || m.text.includes('FAIL') ? 'error' :
                  m.text.includes('성공') || m.text.includes('완료') ? 'success' : '';
      return `<div class="msg-status ${cls}"><pre>${esc(m.text)}</pre></div>`;
    }
    const cls = m.from === 'user' ? 'msg-user' : m.from === 'worker' ? 'msg-worker' : 'msg-pm';
    const qcls = m.type === 'question' ? ' msg-question' : '';
    const label = m.from === 'pm' ? 'PM' : m.from === 'worker' ? `워커: ${m.workerId||''}${m.type === 'broadcast' ? ' (공유)' : m.type === 'ask' ? ' (질의)' : ''}` : '';
    return `
      <div class="msg ${cls}${qcls}">
        ${label ? `<div class="msg-label">${esc(label)}</div>` : ''}
        <pre>${esc(m.text)}</pre>
        <div class="msg-time">${fmtTime(m.time)}</div>
      </div>`;
  }).join('');

  if (chat.length !== lastChatLen) {
    lastChatLen = chat.length;
    container.scrollTop = container.scrollHeight;
  }
}

function renderPhaseBar() {
  const phases = ['planning','executing','waiting_user'];
  const order = {idle:-1,planning:0,executing:1,waiting_user:1,replanning:0,done:3,error:3};
  const idx = order[state.status] ?? -1;
  document.querySelectorAll('.phase-step').forEach(el => {
    const pi = phases.indexOf(el.dataset.phase);
    el.classList.remove('active','done');
    if (state.status === el.dataset.phase) el.classList.add('active');
    else if (pi < idx || state.status === 'done') el.classList.add('done');
  });
}

function renderWorkers(workers) {
  const c = document.getElementById('workersContainer');
  if (!workers.length) { c.innerHTML = '<div style="color:var(--text-dim);font-size:12px;">아직 워커 없음</div>'; return; }
  const statusLabel = {pending:'대기', running:'실행 중', done:'완료', failed:'실패', waiting:'대기 중'};
  c.innerHTML = workers.map(w => {
    const plan = w.plan || [];
    const doneCount = plan.filter(s => s.status === 'done').length;
    const totalCount = plan.length;
    const progressPct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
    const progressLine = totalCount > 0
      ? (w.currentStepIndex
          ? `▶ ${w.currentStepIndex}/${totalCount} — ${esc(w.currentStepTitle || '')}`
          : (w.status === 'done' ? `완료 (${totalCount}/${totalCount})` : `${doneCount}/${totalCount} 완료`))
      : '';
    const planHtml = plan.length > 0 ? `
      <div class="wc-progress">${progressLine}</div>
      <div class="wc-progress-bar"><div style="width:${progressPct}%"></div></div>
      <div class="wc-plan">
        ${plan.map(s => {
          const icon = s.status === 'done' ? '✅' :
                       s.status === 'running' ? '▶️' :
                       s.status === 'stolen' ? `🫳${s.claimedBy||''}` : '⬜';
          return `<div class="ps ps-${s.status}"><span class="ps-icon">${icon}</span><span class="ps-title">${s.index}. ${esc(s.title)}</span></div>`;
        }).join('')}
      </div>
    ` : '';
    const broadcastsHtml = (w.broadcasts && w.broadcasts.length) ? `
      <div class="wc-broadcasts">
        ${w.broadcasts.slice(-2).map(b => `<div class="br">📢 ${esc(b.message.slice(0, 100))}</div>`).join('')}
      </div>
    ` : '';
    return `
      <div class="worker-card ${w.status}" onclick="openLogPopup('${esc(w.taskId)}')">
        <div class="wc-header">
          <span class="wc-id">${esc(w.taskId)}</span>
          <span class="wc-role">${esc(w.role)}</span>
          <div class="wc-status"><span class="dot dot-${w.status}"></span>${statusLabel[w.status] || w.status}</div>
        </div>
        <div class="wc-mission">${esc(w.mission || '')}</div>
        ${planHtml}
        <div class="wc-meta">
          <span>$<span class="v">${w.costUsd.toFixed(4)}</span></span>
          <span><span class="v">${fmtMs(w.durationMs || (w.startTime ? Date.now()-w.startTime : 0))}</span></span>
          <span>입:<span class="v">${(w.inputTokens||0).toLocaleString()}</span></span>
          <span>출:<span class="v">${(w.outputTokens||0).toLocaleString()}</span></span>
        </div>
        ${w.currentTool ? `<div class="wc-tool">&gt; ${esc(w.currentTool)}</div>` : ''}
        ${broadcastsHtml}
        <div class="wc-logs">${(w.logs||[]).slice(-8).map(l=>`<div class="ll">${fmtTime(l.time)} ${esc(l.message)}</div>`).join('')}</div>
      </div>`;
  }).join('');
  c.querySelectorAll('.wc-logs').forEach(el => { el.scrollTop = el.scrollHeight; });
}

function fmtMs(ms) { if(ms<1000)return'0s'; const s=Math.floor(ms/1000); return s<60?`${s}s`:`${Math.floor(s/60)}m ${s%60}s`; }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function esc(s) { if(!s)return''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ─── Orchestrator card ───
function renderOrchCard() {
  const s = state.status || 'idle';
  const dot = document.getElementById('orchDot');
  const txt = document.getElementById('orchStatusText');
  const act = document.getElementById('orchActivity');

  const dotClass = {
    idle:'dot-pending', planning:'dot-running', executing:'dot-running',
    waiting_user:'dot-waiting', replanning:'dot-running', done:'dot-done', error:'dot-failed'
  }[s] || 'dot-pending';
  dot.className = `dot ${dotClass}`;
  const statusKo = {idle:'대기', planning:'계획 중', executing:'실행 중', waiting_user:'사용자 대기', replanning:'재계획', done:'완료', error:'에러'};
  txt.textContent = statusKo[s] || s;

  // 최신 PM 발언 미리보기
  const chat = state.chat || [];
  const lastPM = [...chat].reverse().find(m => m.from === 'pm');
  if (lastPM) {
    const preview = lastPM.text.split('\n')[0].slice(0, 80);
    const isActive = ['planning','executing','replanning'].includes(s);
    act.textContent = isActive ? `${preview}…` : preview;
    act.className = `orch-activity${isActive ? ' active' : ''}`;
  } else {
    act.textContent = '작업 대기 중…';
    act.className = 'orch-activity';
  }
}

// ─── Log popup ───
let activeLogPopup = null;

function openLogPopup(id) {
  activeLogPopup = id;
  document.getElementById('logOverlay').style.display = '';
  renderLogPopup(id);
}

function closeLogPopup() {
  activeLogPopup = null;
  document.getElementById('logOverlay').style.display = 'none';
}

function renderLogPopup(id) {
  const title = document.getElementById('logPopupTitle');
  const body = document.getElementById('logPopupBody');

  if (id === 'orchestrator') {
    title.textContent = 'PM (오케스트레이터) 로그';
    const chat = state.chat || [];
    body.innerHTML = chat.map(m => {
      const typeClass = m.from === 'user' ? 'lp-type-text' :
        m.type === 'status' ? (m.text.includes('FAIL') || m.text.includes('fail') ? 'lp-type-error' :
          m.text.includes('completed') || m.text.includes('success') ? 'lp-type-done' : 'lp-type-text') :
        m.type === 'plan' ? 'lp-type-init' :
        m.type === 'question' ? 'lp-type-warn' : 'lp-type-text';
      const prefix = m.from === 'user' ? '[USER]' : m.from === 'worker' ? `[${m.workerId||'worker'}]` : '[PM]';
      return `<div class="lp-line"><span class="lp-time">${fmtTime(m.time)}</span><span class="${typeClass}">${esc(prefix)} ${esc(m.text.split('\n')[0].slice(0,120))}</span></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
    return;
  }

  // Worker log
  const workers = state.workers ? Object.values(state.workers) : [];
  const w = workers.find(ww => ww.taskId === id);
  if (!w) { body.innerHTML = '<div style="color:var(--text-dim)">워커를 찾을 수 없음</div>'; return; }

  title.textContent = `워커: ${w.taskId} [${w.role}]`;
  const logs = w.logs || [];
  body.innerHTML = logs.map(l => {
    const cls = l.type === 'tool' ? 'lp-type-tool' :
      l.type === 'init' ? 'lp-type-init' :
      l.type === 'warn' ? 'lp-type-warn' :
      l.type === 'error' ? 'lp-type-error' :
      l.type === 'done' ? 'lp-type-done' :
      l.type === 'plan' ? 'lp-type-init' :
      l.type === 'step' || l.type === 'step_done' ? 'lp-type-tool' :
      l.type === 'broadcast' ? 'lp-type-warn' :
      l.type === 'ask_pm' || l.type === 'ask_worker' ? 'lp-type-warn' :
      l.type === 'ask_pm_answer' || l.type === 'ask_worker_answer' ? 'lp-type-init' :
      l.type === 'claim' || l.type === 'stolen' ? 'lp-type-warn' :
      l.type === 'task_done' ? 'lp-type-done' : 'lp-type-text';
    return `<div class="lp-line"><span class="lp-time">${fmtTime(l.time)}</span><span class="${cls}">${esc(l.message)}</span></div>`;
  }).join('');

  // 실행 중이면 활동 인디케이터
  if (w.status === 'running') {
    const dots = '.'.repeat((Math.floor(Date.now()/500) % 3) + 1);
    body.innerHTML += `<div class="lp-line"><span class="lp-time">${fmtTime(Date.now())}</span><span class="lp-type-tool">작업 중${dots}</span></div>`;
  }

  body.scrollTop = body.scrollHeight;
}

// ESC to close popup
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLogPopup(); });

setInterval(() => {
  if (['executing','planning','waiting_user','replanning'].includes(state.status)) render();
}, 1000);

connect();
</script>
</body>
</html>
